{{- if not .Values.existingSecret }}
{{- /* Reuse an existing api-key on upgrade so it does not rotate; else use the
       provided value; else generate a random one on first install. */ -}}
{{- $secretName := include "terminals-minimal.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $apiKey := .Values.apiKey -}}
{{- if and (not $apiKey) $existing $existing.data -}}
{{- $apiKey = index $existing.data "api-key" | b64dec -}}
{{- end -}}
{{- if not $apiKey -}}
{{- $apiKey = randAlphaNum 40 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "terminals-minimal.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $apiKey | quote }}
{{- end }}
