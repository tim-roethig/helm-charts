apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "terminals-minimal.fullname" . }}
  labels:
    {{- include "terminals-minimal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "terminals-minimal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "terminals-minimal.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "terminals-minimal.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: TERMINALS_BACKEND
              value: "kubernetes"
            - name: TERMINALS_HOST
              value: "0.0.0.0"
            - name: TERMINALS_PORT
              value: {{ .Values.service.port | quote }}
            - name: TERMINALS_KUBERNETES_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: TERMINALS_IMAGE
              value: {{ .Values.terminalImage | quote }}
            - name: TERMINALS_IDLE_TIMEOUT_MINUTES
              value: {{ .Values.idleTimeoutMinutes | quote }}
            - name: TERMINALS_KUBERNETES_RESTRICTED
              value: {{ .Values.restricted | quote }}
            {{- if .Values.persistence.enabled }}
            - name: TERMINALS_KUBERNETES_STORAGE_SIZE
              value: {{ .Values.persistence.size | quote }}
            - name: TERMINALS_KUBERNETES_STORAGE_MODE
              value: {{ .Values.persistence.mode | quote }}
            {{- if .Values.persistence.storageClass }}
            - name: TERMINALS_KUBERNETES_STORAGE_CLASS
              value: {{ .Values.persistence.storageClass | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.terminalLimits.cpu }}
            - name: TERMINALS_MAX_CPU
              value: {{ .Values.terminalLimits.cpu | quote }}
            {{- end }}
            {{- if .Values.terminalLimits.memory }}
            - name: TERMINALS_MAX_MEMORY
              value: {{ .Values.terminalLimits.memory | quote }}
            {{- end }}
            {{- if .Values.terminalLimits.storage }}
            - name: TERMINALS_MAX_STORAGE
              value: {{ .Values.terminalLimits.storage | quote }}
            {{- end }}
            - name: TERMINALS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "terminals-minimal.secretName" . }}
                  key: api-key
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
