apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui-terminals
  namespace: open-webui
  labels:
    app.kubernetes.io/name: openwebui-terminals
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: open-terminal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openwebui-terminals
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openwebui-terminals
        app.kubernetes.io/component: orchestrator
        app.kubernetes.io/part-of: open-terminal
    spec:
      serviceAccountName: openwebui-terminals
      # OpenShift restricted-v2 friendly: do NOT set runAsUser here, the SCC
      # assigns one from the namespace UID range.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: "ghcr.io/open-webui/terminals:latest"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TERMINALS_BACKEND
              value: "kubernetes"
            - name: TERMINALS_HOST
              value: "0.0.0.0"
            - name: TERMINALS_PORT
              value: "8080"
            # Namespace the orchestrator spawns terminal pods into (this one).
            - name: TERMINALS_KUBERNETES_NAMESPACE
              value: "open-webui"
            # Image used for each per-user terminal pod.
            - name: TERMINALS_IMAGE
              value: "ghcr.io/open-webui/open-terminal:latest"
            # Idle terminal cleanup, minutes (0 = never).
            - name: TERMINALS_IDLE_TIMEOUT_MINUTES
              value: "30"
            # Apply restricted (OpenShift/PSA-compatible) security context to
            # spawned terminal pods: runAsNonRoot, drop ALL caps, no privilege
            # escalation, RuntimeDefault seccomp -- without pinning a UID.
            - name: TERMINALS_KUBERNETES_RESTRICTED
              value: "true"
            # The open-terminal image runs as its build user (uid 1000, with
            # HOME=/home/user) and sets no ENV HOME. Under the default
            # restricted-v2 SCC OpenShift assigns an arbitrary UID with no passwd
            # entry, so HOME is empty and the entrypoint dies with:
            #   mkdir: cannot create directory '//.local': Permission denied
            # Pin uid + fsGroup 1000 so HOME resolves and the /home/user volume is
            # group-writable. This is merged into every spawned terminal pod.
            # REQUIRES granting the nonroot-v2 SCC to the terminals namespace's
            # default ServiceAccount (one-time, cluster-admin):
            #   oc adm policy add-scc-to-user nonroot-v2 -z default -n open-webui
            - name: TERMINALS_KUBERNETES_POD_SECURITY_CONTEXT
              value: '{"runAsUser":1000,"runAsNonRoot":true,"fsGroup":1000,"seccompProfile":{"type":"RuntimeDefault"}}'
            # Per-terminal persistent storage.
            - name: TERMINALS_KUBERNETES_STORAGE_SIZE
              value: "1Gi"
            - name: TERMINALS_KUBERNETES_STORAGE_MODE
              value: "per-user"
            # Leave STORAGE_CLASS unset to use the cluster's default StorageClass.
            # - name: TERMINALS_KUBERNETES_STORAGE_CLASS
            #   value: "gp3"
            - name: TERMINALS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-terminals-api-key
                  key: api-key
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            # The image writes its SQLite DB into <site-packages>/data, which an
            # OpenShift-assigned (arbitrary, non-root) UID cannot write. Mount a
            # writable volume exactly there so the image's default DB path works.
            # We deliberately do NOT override TERMINALS_DATABASE_URL: the released
            # :latest image mangles a supplied sqlite+aiosqlite URL. If the image's
            # Python version changes, update this path (see `python3 --version`).
            - name: data
              mountPath: /usr/local/lib/python3.12/site-packages/data
      volumes:
        # Writable scratch for the orchestrator's SQLite DB. On OpenShift the
        # SCC-injected fsGroup makes this writable by the pod's UID.
        # NOTE: emptyDir is ephemeral -- the terminal-tracking DB is lost on
        # pod restart. For persistence, replace it with a PVC.
        - name: data
          emptyDir: {}
