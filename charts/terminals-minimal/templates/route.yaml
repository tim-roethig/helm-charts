{{- if .Values.route.enabled }}
# OpenShift Route -- only rendered when route.enabled=true. Use this when your
# Open WebUI instance runs OUTSIDE this cluster and must reach the orchestrator
# over an external URL. In-cluster Open WebUI should use the Service instead.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "terminals-minimal.fullname" . }}
  labels:
    {{- include "terminals-minimal.labels" . | nindent 4 }}
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "terminals-minimal.fullname" . }}
    weight: 100
  port:
    targetPort: http
  {{- if .Values.route.tls }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
  wildcardPolicy: None
{{- end }}
