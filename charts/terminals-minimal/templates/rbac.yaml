apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "terminals-minimal.fullname" . }}
  labels:
    {{- include "terminals-minimal.labels" . | nindent 4 }}
---
# Namespaced Role: the orchestrator only ever creates terminal pods and their
# supporting objects in its OWN namespace, so no ClusterRole is required.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "terminals-minimal.fullname" . }}
  labels:
    {{- include "terminals-minimal.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec", "pods/attach"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "terminals-minimal.fullname" . }}
  labels:
    {{- include "terminals-minimal.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "terminals-minimal.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "terminals-minimal.fullname" . }}
    namespace: {{ .Release.Namespace }}
