apiVersion: v1
kind: ServiceAccount
metadata:
  name: openwebui-terminals
  namespace: open-webui
  labels:
    app.kubernetes.io/name: openwebui-terminals
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: open-terminal
---
# Namespaced Role: the orchestrator only ever creates terminal pods and their
# supporting objects in its OWN namespace, so no ClusterRole is required.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openwebui-terminals
  namespace: open-webui
  labels:
    app.kubernetes.io/name: openwebui-terminals
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: open-terminal
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec", "pods/attach"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openwebui-terminals
  namespace: open-webui
  labels:
    app.kubernetes.io/name: openwebui-terminals
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: open-terminal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openwebui-terminals
subjects:
  - kind: ServiceAccount
    name: openwebui-terminals
    namespace: open-webui
