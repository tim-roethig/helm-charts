# Default values for the minimal Open WebUI Terminals chart.
#
# This chart runs a single "orchestrator" Deployment that talks to the
# Kubernetes API and spawns one Open Terminal pod per user on demand.
# There is no operator and no CRD -- the orchestrator itself is the
# controller (TERMINALS_BACKEND=kubernetes).

# -- Override the chart name used in resource names/labels.
nameOverride: ""
# -- Override the full release name used for all resources.
fullnameOverride: ""

# -- Image for the orchestrator (the service Open WebUI connects to).
image:
  repository: ghcr.io/open-webui/terminals
  tag: latest
  pullPolicy: IfNotPresent

# -- Image used for each per-user terminal pod the orchestrator spawns.
terminalImage: ghcr.io/open-webui/open-terminal:latest

# -- Number of orchestrator replicas. Keep at 1 (it holds no shared state
# beyond the Kubernetes objects it creates).
replicaCount: 1

service:
  # -- Service type. ClusterIP is enough: Open WebUI reaches the orchestrator
  # over in-cluster DNS. Only change this if Open WebUI lives outside the cluster.
  type: ClusterIP
  # -- Port the orchestrator listens on and the Service exposes.
  port: 8080

# -- Shared bearer key between Open WebUI and the orchestrator. Leave empty
# to auto-generate one on first install (read it back with the command in
# NOTES.txt). Ignored when existingSecret is set.
apiKey: ""

# -- Use an existing Secret (with key `api-key`) instead of creating one.
existingSecret: ""

# -- Minutes of inactivity before a spawned terminal pod is cleaned up (0 = never).
idleTimeoutMinutes: 30

persistence:
  # -- Give each terminal a PersistentVolumeClaim so its home directory survives restarts.
  enabled: true
  # -- Size of each terminal's PVC.
  size: 1Gi
  # -- StorageClass for terminal PVCs. Empty = cluster default (recommended on OpenShift).
  storageClass: ""
  # -- Storage layout: per-user | shared | shared-rwo
  mode: per-user

# -- OpenShift restricted-v2 friendly defaults for the SPAWNED terminal pods.
# When true the orchestrator sets runAsNonRoot, drops ALL capabilities,
# disables privilege escalation and applies the RuntimeDefault seccomp profile
# WITHOUT pinning a UID, so OpenShift assigns one from the namespace range.
# Keep this true on OpenShift.
restricted: true

# -- Optional hard per-terminal resource caps. Leave empty to omit.
terminalLimits:
  cpu: "" # e.g. "1"
  memory: "" # e.g. "512Mi"
  storage: "" # e.g. "2Gi"

# -- Resource requests/limits for the orchestrator pod itself.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Pod-level security context for the orchestrator.
# NOTE: do NOT set runAsUser here on OpenShift -- let the SCC inject it.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context for the orchestrator. Compatible with
# OpenShift's restricted-v2 SCC and Kubernetes Pod Security "restricted".
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Optional OpenShift Route to expose the orchestrator OUTSIDE the cluster.
# Only needed when your Open WebUI instance runs outside this cluster. When
# Open WebUI is in the same cluster, leave this disabled and use the in-cluster
# Service URL (see NOTES.txt).
route:
  enabled: false
  # -- Route host. Empty lets OpenShift generate one.
  host: ""
  # -- Terminate TLS at the router (edge).
  tls: true

# -- Scheduling controls for the orchestrator pod.
nodeSelector: {}
tolerations: []
affinity: {}
